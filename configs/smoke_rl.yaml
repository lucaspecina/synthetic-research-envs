# Smoke RL configuration — validates the training loop end-to-end before
# the canonical tesis run.
#
# IMPORTANT: this is NOT the canonical held-out split of Issue #14. The
# split below is for smoke validation only; when #14 closes, the
# canonical config replaces this one.
#
# Policy and scorer clients default to POLICY_* / SCORER_* / AZURE_* env
# vars via resolve_role_config (see src/sreg/training/eval_config.py).
# Override from the CLI: --policy-base-url, --scorer-model, etc.

dataset:
  # Path to the case-folders directory. Each case has <dir>/<case>/src.json.
  # Uses env var expansion so the config is portable between Windows dev
  # and H100 Linux — set SREG_P05_BATCH to the absolute path on each host.
  dir: ${SREG_P05_BATCH}

  # Explicit case IDs — NOT a seeded random split. Explicit list
  # guarantees the smoke is reproducible across hosts regardless of
  # filesystem ordering.
  train_cases:
    - missing_data
    - policy_equity
    - competing_mech
    - poverty
    - immunotherapy
    - microbiome
    - chemical
    - heterogeneity
    - confounding
    - coral_bleach

  # Holdout: 1 top-tier case (selection_bias, v1 score 0.762) + 1
  # bottom-tier (identifiability, v1 score 0.218). Smoke only — exists
  # to sanity-check that eval on held-out works, NOT to anchor the
  # tesis evaluation.
  holdout_cases:
    - selection_bias
    - identifiability

# Rollout / env config. Matches v1 canonical harness (claim_cap=15,
# max_turns=15) so smoke numbers are comparable to v1 solver eval.
rollout:
  temperature: 0.7   # training rollouts (eval BEFORE/AFTER uses 0.0)
  max_turns: 15
  claim_cap: 15      # = v1 canonical (NOT the 5 that eval_oi default picked)
  n_mc: 10000        # smoke: 10k for speed. Canonical: 20k (matches v1).

# Training loop config. Smoke values — the canonical run lifts most of
# these (see research/synthesis/sreg_training_transfer_protocol.md
# "Lo que todavia falta fijar").
#
# IMPORTANT — batch_size semantics in RLConfig:
#   batch_size           = total ROLLOUTS per global step (NOT prompts)
#   rollouts_per_example = G (rollouts per prompt; >= 2 for GRPO variance)
#   prompts_per_step     = batch_size / rollouts_per_example  (derived)
#   micro_batch_size     = rollouts per GPU per grad-accum step
#   assert batch_size % (micro_batch_size * num_processes) == 0
#
# Smoke numbers (2026-04-15, Codex-calibrated):
#   batch_size=8, G=4         -> 2 prompts per step, 8 rollouts
#   max_steps=10              -> 80 rollouts total for the smoke
#   max_concurrent=8          -> vLLM parallelism on H100
#   scorer Azure concurrency  -> raised to 2 for training (was 1 for dry-run)
#                                to keep scoring out of the critical path.
#                                Canonical: revisit once vLLM is the
#                                bottleneck, not Azure.
#
# The dry-run gate ignores most of these (it hardcodes num_examples=1,
# rollouts=1). They only matter for --train.
training:
  # Model + run identity
  model: Qwen/Qwen3-8B
  run_name: smoke_sreg_rl_0

  # GRPO batch structure
  rollouts_per_example: 4    # G. RLConfig asserts >= 2. Canonical: 8-16.
  batch_size: 8              # rollouts per step (2 prompts x G=4)
  micro_batch_size: 1        # H100 80GB + Qwen3-8B LoRA entra con mb=1
  max_concurrent: 8          # policy rollouts to vLLM. Canonical: 16-32.

  # Training steps
  total_steps: 10            # smoke. Canonical: 500-2000.
  seed: 42                   # = v1 canonical.

  # Sequence / sampling limits — OI is multi-turn, defaults truncate
  max_tokens: 1024           # per-turn cap. Canonical: 2048 if truncation hurts.
  max_seq_len: 8192          # full sequence. OI typical: 10-15 turns.

  # Optimizer
  learning_rate: 1.0e-5      # RLConfig default; safe starting point for LoRA.

  # LoRA (Qwen3-8B uses LLaMA-style attention so default target_modules work)
  use_lora: true
  lora_rank: 16              # RLConfig default is 8; 16 is typical for 8B.
  lora_alpha: 32             # 2x rank is the "stable" ratio.

  # vLLM server (must be up BEFORE `--train` — `vf-rl` or manual `vf-vllm`)
  vllm_server_host: 0.0.0.0
  vllm_server_port: 8000

  # Logging + checkpointing (conservative for smoke)
  save_steps: 10             # 1 checkpoint at end of smoke.
  logging_steps: 1           # every step — smoke visibility.
  report_to: null            # set to "wandb" on H100 if WANDB_API_KEY set.
