[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sreg"
version = "0.1.0"
description = "Synthetic Research Environment Generator for evaluating LLM scientific reasoning"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.1",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=1.5",
    "pydantic>=2.0",
    "openai>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "statsmodels>=0.14",
    "linearmodels>=7.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
