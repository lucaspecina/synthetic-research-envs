[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sreg"
version = "0.1.0"
description = "Synthetic Research Environment Generator for evaluating LLM scientific reasoning"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.1",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=1.5",
    "pydantic>=2.0",
    "openai>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "statsmodels>=0.14",
    "linearmodels>=7.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.5",
]
# Training harness dependencies. Pinned so the smoke test / eval / first RL
# run reproduce from a clean env. `verifiers` is pinned exactly because its
# public API (StatefulToolEnv, evaluate_sync, state_columns) is still
# pre-1.0 and minor bumps have broken our imports before. `datasets` has
# a much more stable API so a minimum floor is enough.
#
# NOT included here: `verifiers-rl` (Linux + CUDA only — would break
# Windows dev env). That lives in the `rl` extra below.
training = [
    "verifiers==0.1.11",
    "datasets>=2.0",
]

# RL trainer extra. Install on the H100 host only: `pip install -e ".[rl]"`.
# Pulls `verifiers-rl` (GRPO trainer on top of transformers/accelerate/vllm/peft).
# Intentionally installed via git+subdirectory so we track the same commit
# as the pinned `verifiers==0.1.11` — both packages live in the same
# monorepo and need to be compatible. Switch to pypi `verifiers-rl==x.y`
# once the trainer API stabilizes.
#
# Windows compat: do NOT install this on dev. The underlying deps
# (deepspeed, bitsandbytes via peft, vllm, triton) assume Linux+CUDA.
# That's why we keep `training` and `rl` as separate extras.
rl = [
    "verifiers-rl @ git+https://github.com/willccbb/verifiers.git@main#subdirectory=packages/verifiers-rl",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
